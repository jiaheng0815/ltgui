name: CI

on:
  push:
    branches: [master, main, beta]
  pull_request:
    branches: [master, main, beta]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libx11-dev libxft-dev libxrender-dev \
            libfontconfig-dev libegl-dev libgles-dev

      - name: Build
        run: python3 ltgui.py build

      - name: Test
        run: python3 ltgui.py test

      - name: Test (ASan + UBSan)
        run: python3 ltgui.py test --sanitize

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Cocoa backend)
        run: python3 ltgui.py build

      - name: Test
        run: python3 ltgui.py test

  windows-clang:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM
        run: |
          if (-not (Get-Command "clang++" -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }

      - name: Build
        run: python ltgui.py build

      - name: Test
        run: python ltgui.py test

      - name: SDK (--dll)
        run: python ltgui.py build --dll ./sdk

      - name: GUI smoke (demo.exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\demo.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($p.HasExited) {
            throw "demo.exe exited early with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: python ltgui.py build --compiler msvc

      - name: Test
        run: python ltgui.py test --compiler msvc
