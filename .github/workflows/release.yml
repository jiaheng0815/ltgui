name: Release

# Automatic SDK release on tags vX.Y.Z:
# builds the static SDK on Linux/macOS/Windows and uploads a platform-suffixed
# archive to the GitHub Release created for the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libx11-dev libxft-dev libxrender-dev \
            libfontconfig-dev libegl-dev libgles-dev

      - name: Build (release)
        run: python3 ltgui.py build release

      - name: Package SDK
        run: |
          python3 ltgui.py package --format zip
          version=$(python3 -c "import sys; sys.path.insert(0,'.'); import ltgui; print(ltgui.LTGUI_VERSION)")
          cp build/ltgui-${version}-sdk.zip build/ltgui-${version}-sdk-linux.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux
          path: build/ltgui-*-sdk-linux.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        run: python3 ltgui.py build release

      - name: Package SDK
        run: |
          python3 ltgui.py package --format zip
          version=$(python3 -c "import sys; sys.path.insert(0,'.'); import ltgui; print(ltgui.LTGUI_VERSION)")
          cp build/ltgui-${version}-sdk.zip build/ltgui-${version}-sdk-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-macos
          path: build/ltgui-*-sdk-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup LLVM
        run: |
          if (-not (Get-Command "clang++" -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
          }

      - name: Build (release)
        run: python ltgui.py build release

      - name: Package SDK
        run: |
          python ltgui.py package --format zip
          $version = python -c "import sys; sys.path.insert(0,'.'); import ltgui; print(ltgui.LTGUI_VERSION)"
          Copy-Item "build/ltgui-${version}-sdk.zip" "build/ltgui-${version}-sdk-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-windows
          path: build/ltgui-*-sdk-windows.zip

  release:
    runs-on: ubuntu-latest
    needs: [linux, macos, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ltgui ${{ github.ref_name }}
          body: |
            Auto-built SDK archives for ${{ github.ref_name }}:

            - `ltgui-*-sdk-linux.zip` — static library + amalgamated header (Linux)
            - `ltgui-*-sdk-macos.zip` — static library + amalgamated header (macOS)
            - `ltgui-*-sdk-windows.zip` — static library + amalgamated header (Windows)

            See README.md for build/usage instructions.
          files: artifacts/*
